<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1730" />
    <meta name="description" content="{{ page.description | default: site.description | escape }}" />
    <title>{{ page.title | default: site.title | escape }} — bluewing</title>
    <link rel="stylesheet" href="{{ '/blog/blog.css' | relative_url }}" />
  </head>
  <body>
    <div class="blog-page">
      <header class="blog-header">
        <div class="blog-header-inner">
          <a class="blog-brand" href="{{ '/blog/' | relative_url }}">
            <span class="blog-brand-title">my blog</span>
            <span class="blog-brand-subtitle">by bluewing</span>
          </a>
        </div>
      </header>

      <main class="blog-main{% if page.permalink == '/blog/' %} blog-home-main{% endif %}">
        {{ content }}
      </main>

      <footer class="blog-footer">
        <p>bluewing archive · <a href="{{ '/' | relative_url }}">personal site</a></p>
      </footer>
    </div>
  </body>
</html>
